{{- $fullname := include "app.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
      annotations:
        # Redémarre les pods quand les secrets changent
        checksum/secret-env: {{ toJson .Values.secretEnv | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ required "image.repository est requis" .Values.image.repository }}:{{ required "image.tag est requis" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- if or .Values.env .Values.database.enabled }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.database.enabled }}
            {{- $db := .Values.database }}
            - name: {{ $db.envPrefix }}_URL
              value: "jdbc:postgresql://{{ required "database.cluster est requis" $db.cluster }}-rw:5432/{{ required "database.name est requis" $db.name }}"
            - name: {{ $db.envPrefix }}_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $db.cluster }}-app
                  key: username
            - name: {{ $db.envPrefix }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $db.cluster }}-app
                  key: password
            {{- end }}
          {{- end }}
          {{- if or .Values.secretEnv .Values.envFromSecrets }}
          envFrom:
            {{- if .Values.secretEnv }}
            - secretRef:
                name: {{ $fullname }}-env
            {{- end }}
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          {{- with .Values.probes.startup }}
          {{- if .path }}
          startupProbe:
            {{- include "app.httpProbe" . | nindent 12 }}
            periodSeconds: 5
            failureThreshold: {{ .failureThreshold | default 30 }}
          {{- end }}
          {{- end }}
          {{- with .Values.probes.liveness }}
          livenessProbe:
            {{- include "app.httpProbe" . | nindent 12 }}
            periodSeconds: 10
            failureThreshold: 3
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            {{- include "app.httpProbe" . | nindent 12 }}
            periodSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
