# Construit l'image ; aucun déploiement automatique.
#
#   pull request  → build de contrôle (rien n'est publié)
#   push sur main → image ghcr.io/<dépôt>:sha-<commit> publiée, prête à être déployée
#
# Les déploiements se lancent à la main, dans l'onglet Actions :
#   Déployer  (deploy-version.yml) → une image existante en test ou en prod (retour arrière compris)
#   Release   (release.yml)        → nouvelle version patch, minor ou major : tag, Release GitHub, prod
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag de l'image
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sur une pull request (dont celles de Renovate) : build de contrôle, rien n'est publié
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé
        if: github.event_name != 'pull_request'
        run: |
          echo "Image \`${IMAGE}:${{ steps.meta.outputs.tag }}\` publiée." >> "$GITHUB_STEP_SUMMARY"
          echo "Pour la déployer : Actions, **Déployer**, Run workflow (test), ou **Release** (prod)." >> "$GITHUB_STEP_SUMMARY"
