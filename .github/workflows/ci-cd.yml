# Construit l'image, la déploie en test sur main, et en prod sur un tag de version.
#
#   pull request  → build de contrôle (rien n'est publié ni déployé)
#   push sur main → image ghcr.io/augustinde/front-demo:sha-<commit>, déployée en test (namespace demo)
#   tag v1.2.3    → la MÊME image, réétiquetée v1.2.3, déployée en prod (namespace demo-prod)
#
# Côté GitHub (procédure k3s, étapes 0, 10 et 11) :
#   Variables de dépôt     K8S_API_HOST (vide = aucun déploiement), K8S_CA_DATA (make ci-ca)
#   Environnement test     branche main ; secrets CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET
#   Environnement prod     tags v* ; mêmes secrets
# Aucun jeton Kubernetes n'est stocké : l'identité vient de GitHub (OIDC).
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag de l'image
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sur une pull request (dont celles de Renovate) : build de contrôle, rien n'est publié
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-test:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.K8S_API_HOST != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: test
      namespace: demo
      values-file: deploy/values-test.yaml
      image-tag: ${{ needs.build.outputs.tag }}
    secrets: inherit

  # Tag v* : aucune reconstruction. L'image construite pour ce commit sur main (donc déjà
  # passée en test) reçoit le tag de version, et c'est elle qui part en prod.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Réétiqueter l'image testée en ${{ github.ref_name }}
        run: |
          SRC="$IMAGE:sha-${GITHUB_SHA::7}"
          if ! docker buildx imagetools inspect "$SRC" > /dev/null 2>&1; then
            echo "::error::Image $SRC introuvable : ce commit n'a pas été construit sur main. Pousse-le sur main, vérifie-le en test, puis pose le tag."
            exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" "$SRC"

  deploy-prod:
    needs: release
    if: vars.K8S_API_HOST != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      namespace: demo-prod
      values-file: deploy/values-prod.yaml
      image-tag: ${{ github.ref_name }}
    secrets: inherit
